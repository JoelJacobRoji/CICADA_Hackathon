[project]
name = "aegis-saas-api"
version = "0.1.0"
description = "AEGIS central SaaS (Tier 2): metadata-only, multi-tenant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aegis-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "pyyaml>=6.0.2",
  "httpx>=0.28",  # Gemini client (Phase 6)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_api"]

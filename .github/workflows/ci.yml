name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # CI-only throwaway values (not real secrets).
      AEGIS_TEST_DB_ADMIN_URL: postgresql://postgres:ci_only_password@127.0.0.1:5432/postgres
      AEGIS_SAAS_DB_APP_PASSWORD: ci_only_app_password_000000
      AEGIS_SAAS_JWT_SIGNING_KEY: ci_only_signing_key_0000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if env/db/key files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.pem$|\.key$'; then exit 1; fi

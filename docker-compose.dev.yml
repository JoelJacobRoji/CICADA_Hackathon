# Local development/test Postgres only. Runtime demo database = Supabase (see docs/DECISIONS.md ADR-18).
name: aegis-dev
services:
  postgres:
    image: postgres:16
    container_name: aegis-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-secrets.py first}
    ports:
      - "127.0.0.1:55432:5432"   # loopback only
    volumes:
      - aegis_pg_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  aegis_pg_data:

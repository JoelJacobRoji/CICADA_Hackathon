[project]
name = "aegis-contracts"
version = "0.1.0"
description = "AEGIS shared data contracts: inbound (local-only) and outbound (allow-listed) schemas"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.9,<3", "tzdata>=2024.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_contracts"]

# AEGIS - stage 1 (HTTP only): ACME challenge + redirect. Additive site; does not touch other sites.
server {
    listen 80;
    listen [::]:80;
    server_name aegis.162-35-42-114.sslip.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aegis-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

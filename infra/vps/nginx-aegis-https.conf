# AEGIS - stage 2 (HTTPS). Appended after stage 1 once the certificate exists.
# Serves the dashboard (static, same origin) at / and proxies the API + WebSocket.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aegis.162-35-42-114.sslip.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/aegis/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aegis/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers. NOTE: no location below uses add_header (that would silently drop these);
    # caching is set with `expires`, which does not affect add_header inheritance.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://aegis.162-35-42-114.sslip.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 1m;   # matches the API's ingest limit

    root /var/www/aegis-web;

    location = /api/v1/ws {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(api/|healthz$|readyz$) {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: every other path serves index.html, never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
